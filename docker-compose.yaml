version: '3.8'

networks:
  microservices-net:
    driver: bridge

volumes:
  orders-db-data:
  payments-db-data:
  grafana-data:

services:
  orders-db:
    image: postgres:15-alpine
    container_name: orders-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_db
    ports:
      - "5433:5432"
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  payments-db:
    image: postgres:15-alpine
    container_name: payments-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_db
    ports:
      - "5434:5432"
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.order
    container_name: order-service
    environment:
      - DB_URL=postgres://postgres:postgres@orders-db:5432/order_db?sslmode=disable
      - PAYMENT_SERVICE_URL=payment-service:50051
    ports:
      - "8080:8080"
    depends_on:
      orders-db:
        condition: service_healthy
      payment-service:
        condition: service_started
    networks:
      - microservices-net

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.payment
    container_name: payment-service
    environment:
      - DB_URL=postgres://postgres:postgres@payments-db:5432/payment_db?sslmode=disable
    ports:
      - "8081:8080" # Exposed on a different host port to avoid conflict, while internal metrics are on 8080
    depends_on:
      payments-db:
        condition: service_healthy
    networks:
      - microservices-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - order-service
      - payment-service
      - node-exporter
    networks:
      - microservices-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - microservices-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - microservices-net
