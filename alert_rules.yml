groups:
  - name: midterm_alerts
    rules:
      - alert: HighLatencyWarning
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="order-service"}[1m])) by (le)) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High Latency on Order Service"
          description: "95th percentile of latency is above 500ms for the last 1 minute."

      - alert: ServiceDownCritical
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Instance Down"
          description: "Service {{ $labels.job }} (instance {{ $labels.instance }}) has been down for more than 30 seconds."
