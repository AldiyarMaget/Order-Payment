name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test_and_lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Install dependencies
        run: go mod download

      - name: Run Tests
        run: go test -v ./...

      - name: Run Linter
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest

  build_and_push:
    name: Build and Push Docker Images
    needs: test_and_lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order, payment, notification]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}-service:${{ github.sha }}

  deploy:
    name: Deploy to Cluster
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Placeholder
        run: |
          echo "Deploying newly built images with tag ${{ github.sha }} to the cluster..."
          # Deploy step placeholder e.g. using kubectl or helm
